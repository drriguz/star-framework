<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spec viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; border-bottom: 1px solid #e0e0e0;
      background: #fafafa; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 16px; margin: 0; color: #333; }
    #spec-select { font-size: 14px; padding: 4px 8px; max-width: 50vw; }
    .empty { padding: 40px 16px; color: #666; font-size: 14px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    .swagger-ui .info { margin: 20px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Spec viewer</h1>
    <select id="spec-select" aria-label="Select feature spec">
      <option value="">Select a spec…</option>
    </select>
  </header>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    (function () {
      var select = document.getElementById('spec-select');

      function load(specUrl) {
        SwaggerUIBundle({
          url: specUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis],
          layout: 'BaseLayout'
        });
      }

      function showEmpty() {
        document.getElementById('swagger-ui').innerHTML =
          '<p class="empty">No specs found under <code>specs/</code>. ' +
          'Serve with <code>node .github/tools/serve.js</code> from the project root, ' +
          'or open directly with <code>?spec=specs/&lt;feature&gt;/openapi.yaml</code>.</p>';
      }

      var initial = new URLSearchParams(window.location.search).get('spec');

      fetch('/api/specs')
        .then(function (r) { return r.json(); })
        .then(function (specs) {
          specs.forEach(function (s) {
            var opt = document.createElement('option');
            opt.value = s.openapi;
            opt.textContent = s.name + ' (openapi.yaml)';
            select.appendChild(opt);
          });
          if (initial) select.value = initial;
          if (select.value) load(select.value); else showEmpty();
        })
        .catch(function () {
          if (initial) load(initial); else showEmpty();
        });

      select.addEventListener('change', function () {
        var val = select.value;
        var url = window.location.pathname + (val ? '?spec=' + encodeURIComponent(val) : '');
        history.replaceState(null, '', url);
        if (val) load(val); else showEmpty();
      });
    })();
  </script>
</body>
</html>
